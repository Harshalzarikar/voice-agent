services:
  # 1. Django Backend
  backend_core:
    image: harshal1412/voice_agent-backend_core:latest
    container_name: voice_agent_core
    env_file:
      - .env
    depends_on:
      - db
    restart: always

  # 2. FastAPI Backend
  backend_streaming:
    image: harshal1412/voice_agent-backend_streaming:latest
    container_name: voice_agent_streaming
    env_file:
      - .env
    restart: always

  # 3. React Frontend
  frontend:
    image: harshal1412/voice_agent-frontend:latest
    container_name: voice_agent_frontend
    restart: always

  # 4. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: voice_agent_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend_core
      - backend_streaming
    restart: always

  # 5. Database
  db:
      image: postgres:15-alpine
      container_name: voice_agent_db
      environment:
        POSTGRES_DB: voice_agent
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: password
      volumes:
        - postgres_data:/var/lib/postgresql/data
      restart: always

volumes:
  postgres_data:
