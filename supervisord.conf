[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx/error.log
stdout_logfile=/var/log/nginx/access.log

[program:backend_core]
command=gunicorn --bind 127.0.0.1:8000 --chdir /app/backend_core config.wsgi:application
autostart=true
autorestart=true
stderr_logfile=/var/log/backend_core.err.log
stdout_logfile=/var/log/backend_core.out.log

[program:backend_streaming]
command=uvicorn backend_streaming.app.main:app --host 127.0.0.1 --port 8001
autostart=true
autorestart=true
stderr_logfile=/var/log/backend_streaming.err.log
stdout_logfile=/var/log/backend_streaming.out.log
